spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: neuroDiagnost

  datasource:
    url: jdbc:postgresql://localhost:5432/neuroDiagnost
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
